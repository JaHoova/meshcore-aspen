; ----------------- RAK4631 + RAK13800 ETHERNET TCP KISS MODEM -----------------
; Append this environment to firmware/nrf52840/.build/upstream/platformio.ini
; (or copy to platformio.local.ini) after running `make -C firmware/nrf52840 prepare`.

[env:rak4631_rak13800_tcp_kiss]
extends = nrf52_base
board = rak4631
board_check = true
board_build.ldscript = boards/nrf52840_s140_v6.ld
extra_scripts =
  ${nrf52_base.extra_scripts}
  post:examples/rak4631_rak13800_tcp_kiss/auto_uf2.py
build_unflags =
  -std=gnu++11
  -D EXTRAFS=1
  -D USE_CC310_HW_CRYPTO=1
  -D ENABLE_ADVERT_ON_BOOT=1
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  -D ENABLE_PRIVATE_KEY_EXPORT=1
  -D LORA_FREQ=869.618
  -D LORA_SF=8
build_flags =
  ${nrf52_base.build_flags}
  -std=gnu++17
  -I variants/rak4631
  -I examples/rak4631_rak13800_tcp_kiss
  -D RAK_4631
  -D RAK_BOARD
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_FREQ=910.525
  -D LORA_SF=7
  -D LORA_CR=5
  -D LORA_TX_POWER=22
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D ETHERNET_ENABLED=1
build_src_filter =
  -<*>
  +<helpers/radiolib/RadioLibWrappers.cpp>
  +<../variants/rak4631/variant.cpp>
  +<../examples/rak4631_rak13800_tcp_kiss/*.cpp>
lib_ignore =
  Adafruit nRFCrypto
lib_deps =
  SPI
  https://github.com/jgromes/RadioLib.git#6d8934836678d8894e3d556550475b37dce3e2b6
  https://github.com/RAKWireless/RAK13800-W5100S/archive/1.0.2.zip
